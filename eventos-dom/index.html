<! DOCTYPE html>
<html Lang-"pt-BR">
<head>
<meta charset="UTF-8">
<title>Callback no clique</title>
<!-- defer: carrega o JS e espera o HTML ser
lido antes de executa-lo. -->
<script src="script.js" defer></script>
</head>
<body>
<!-- h1 = titulo principal mostrado na página.-->

<h1>Meu primeiro evento com callback</h1>
<!-- id identifica o botao para que o JS possa
encontra-lo. -->
<button id="btn">Acender luz</button>
<!-- O JavaScript vai mudar o texto deste
parágrafo no clique. -->
<p id="status">Luz apagada</p>
</body>
</html>
